<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quên Mật Khẩu - PET LUXURY</title>
 <link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green-900: #0b361d;
    --green-700: #166534;
    --green-600: #006b1b;
    --green-500: #16a34a;
    --green-200: #bbf7d0;
    --green-100: #dcfce7;
    --cream:     #faf8f5;
    --gold:      #d4af37;
    --white:     #ffffff;
    --text-dark: #0b361d;
    --text-mid:  #3b5e47;
    --text-soft: #6b8c77;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    position: relative;
    overflow: hidden;
  }

  /* background orbs */
  .bg-orb {
    position: fixed; border-radius: 50%;
    pointer-events: none; filter: blur(80px);
  }
  .bg-orb-1 { width: 500px; height: 500px; top: -15%; left: -15%; background: var(--green-100); opacity: 0.5; }
  .bg-orb-2 { width: 600px; height: 600px; bottom: -20%; right: -15%; background: var(--green-200); opacity: 0.3; }

  /* dot texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(var(--green-200) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.15;
    pointer-events: none;
  }

  .card {
    width: 100%; max-width: 440px;
    background: var(--white);
    border-radius: 24px;
    padding: 2.75rem 2.5rem;
    box-shadow: 0 20px 60px rgba(11,54,29,0.08), 0 4px 16px rgba(11,54,29,0.04);
    position: relative; z-index: 1;
    animation: slideUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @media (max-width: 500px) { .card { padding: 2rem 1.5rem; } }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* LOGO */
  .logo-area {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 2.25rem;
  }
  .logo-ring {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--gold);
    padding: 3px;
    box-shadow: 0 0 0 5px rgba(212,175,55,0.08);
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .logo-ring:hover { transform: rotate(10deg) scale(1.08); }
  .logo-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.45rem; font-weight: 700;
    color: var(--green-600); letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* STEPPER */
  .stepper {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 2.25rem;
  }
  .step-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--green-200);
    transition: all 0.4s ease;
  }
  .step-dot.active {
    background: var(--green-600);
    box-shadow: 0 0 0 4px rgba(0,107,27,0.12);
    width: 28px; border-radius: 5px;
  }
  .step-dot.done { background: var(--green-500); }
  .step-line {
    width: 40px; height: 2px; border-radius: 99px;
    background: var(--green-200);
    transition: background 0.4s ease;
  }
  .step-line.done { background: var(--green-500); }

  /* STEP CONTENT */
  .step { display: none; flex-direction: column; align-items: center; animation: fadeIn 0.35s ease; }
  .step.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .step-icon-wrap {
    width: 76px; height: 76px;
    background: var(--green-100);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1.5rem;
    transition: transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .step-icon-wrap:hover { transform: rotate(-6deg) scale(1.06); }
  .step-icon-wrap .material-symbols-outlined {
    font-size: 36px; color: var(--green-600);
    font-variation-settings: 'FILL' 1;
  }

  .step h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 600;
    color: var(--text-dark);
    text-align: center; margin-bottom: 0.5rem;
    line-height: 1.2;
  }
  .step p.step-desc {
    color: var(--text-soft); font-size: 0.88rem;
    text-align: center; line-height: 1.65;
    margin-bottom: 1.75rem; max-width: 320px;
  }

  .field-group {
    display: flex; flex-direction: column; gap: 0.5rem;
    margin-bottom: 1.25rem; width: 100%;
  }
  .field-label {
    font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-mid); padding-left: 4px;
  }
  .input-wrap { position: relative; width: 100%; }
  .input-icon {
    position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
    font-size: 18px; color: var(--text-soft); pointer-events: none;
    transition: color 0.2s;
    font-family: 'Material Symbols Outlined';
    font-variation-settings: 'FILL' 0, 'wght' 300;
  }
  .field-group:focus-within .input-icon { color: var(--green-600); }

  input[type="email"], input[type="password"] {
    width: 100%;
    background: var(--green-100);
    border: 1.5px solid transparent;
    border-radius: 12px;
    padding: 14px 46px 14px 44px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem; color: var(--text-dark);
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  input:focus {
    border-color: var(--green-600);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(0,107,27,0.08);
  }
  input.input-error {
    border-color: #ef4444;
    box-shadow: 0 0 0 4px rgba(239,68,68,0.08);
  }
  input::placeholder { color: #a8c5b5; }

  .btn-toggle-pass {
    position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    color: var(--text-mid); display: flex; align-items: center; padding: 4px; z-index: 2;
    transition: color 0.2s;
  }
  .btn-toggle-pass:hover { color: var(--green-600); }
  .btn-toggle-pass .material-symbols-outlined { font-size: 20px; font-variation-settings: 'FILL' 0, 'wght' 400; }

  /* Strength bar */
  .strength-wrap { padding: 0 2px; }
  .strength-bars { display: flex; gap: 5px; margin-bottom: 4px; }
  .s-bar { height: 4px; flex: 1; border-radius: 99px; background: var(--green-200); transition: background 0.3s; }
  .strength-label { font-size: 0.75rem; color: var(--text-soft); }

  .err-msg {
    background: #fef2f2; color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 10px; padding: 10px 14px;
    font-size: 0.84rem; margin-bottom: 1rem; width: 100%;
    display: none;
  }

  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--green-700) 0%, var(--green-500) 100%);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; font-weight: 600; letter-spacing: 0.04em;
    border: none; border-radius: 12px; padding: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 20px rgba(0,107,27,0.25);
    transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
    margin-bottom: 1.25rem;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,107,27,0.3); }
  .btn-primary:active { transform: translateY(0) scale(0.98); }
  .btn-primary:disabled { opacity: 0.65; transform: none; cursor: not-allowed; }
  .btn-primary .material-symbols-outlined { font-size: 20px; }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--green-600); font-size: 0.88rem; font-weight: 500;
    background: none; border: none; cursor: pointer;
    padding: 8px 14px; border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  .btn-ghost:hover { background: var(--green-100); }
  .btn-ghost .material-symbols-outlined { font-size: 18px; transition: transform 0.2s; }
  .btn-ghost:hover .material-symbols-outlined { transform: translateX(-3px); }

  /* Success popup */
  #success-popup {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 9999;
    align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .popup-inner {
    background: var(--white); border-radius: 24px;
    padding: 2.5rem 2rem; max-width: 340px; width: 100%;
    text-align: center;
    box-shadow: 0 24px 60px rgba(0,0,0,0.15);
    animation: slideUp 0.4s cubic-bezier(0.16,1,0.3,1);
  }
  .popup-emoji { font-size: 3.5rem; margin-bottom: 1rem; display: block; }
  .popup-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem; font-weight: 700;
    color: var(--text-dark); margin-bottom: 0.5rem;
  }
  .popup-sub { color: var(--text-soft); font-size: 0.88rem; margin-bottom: 1.25rem; }
  .popup-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.5rem; font-weight: 700; color: var(--green-600);
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<!-- Success popup -->
<div id="success-popup">
  <div class="popup-inner">
    <span class="popup-emoji">🎉</span>
    <h3 class="popup-title">Đổi mật khẩu thành công!</h3>
    <p class="popup-sub">Đang chuyển về trang đăng nhập...</p>
    <div class="popup-count" id="countdown">3</div>
  </div>
</div>

<div class="card">

  <!-- Logo -->
  <div class="logo-area">
    <div class="logo-ring">
      <img src="favicon.png" alt="PET LUXURY Logo">
    </div>
    <span class="brand-name">Pet Luxury</span>
  </div>

  <!-- Stepper -->
  <div class="stepper">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot" id="dot2"></div>
  </div>

  <!-- STEP 1: Email -->
  <div class="step active" id="step1">
    <div class="step-icon-wrap">
      <span class="material-symbols-outlined">mail</span>
    </div>
    <h1>Quên mật khẩu?</h1>
    <p class="step-desc">Nhập email đã đăng ký tài khoản. Hệ thống sẽ xác nhận email tồn tại trước khi cho phép đặt lại mật khẩu.</p>

    <div class="err-msg" id="err1"></div>

    <div class="field-group">
      <label class="field-label" for="email">Email đã đăng ký</label>
      <div class="input-wrap">
        <span class="input-icon material-symbols-outlined">mail</span>
        <input id="email" type="email" placeholder="Nhập email của bạn" autocomplete="email"/>
      </div>
    </div>

    <button class="btn-primary" id="btn-step1" onclick="handleStep1()">
      Xác nhận email
      <span class="material-symbols-outlined">arrow_forward</span>
    </button>

    <button class="btn-ghost" onclick="window.location.href='login.html'">
      <span class="material-symbols-outlined">arrow_back</span>
      Quay lại đăng nhập
    </button>
  </div>

  <!-- STEP 2: New Password -->
  <div class="step" id="step2">
    <div class="step-icon-wrap" style="background:#fef9e8;">
      <span class="material-symbols-outlined" style="color:var(--gold)">key</span>
    </div>
    <h1>Mật khẩu mới</h1>
    <p class="step-desc" id="step2-desc">Tạo mật khẩu mới cho tài khoản của bạn.</p>

    <div class="err-msg" id="err2"></div>

    <div class="field-group">
      <label class="field-label">Mật khẩu mới</label>
      <div class="input-wrap">
        <span class="input-icon material-symbols-outlined">lock</span>
        <input id="new-password" type="password" placeholder="Tối thiểu 6 ký tự" oninput="checkStrength()"/>
        <button class="btn-toggle-pass" type="button" onclick="togglePass('new-password', this)">
          <span class="material-symbols-outlined">visibility</span>
        </button>
      </div>
      <div class="strength-wrap">
        <div class="strength-bars">
          <div class="s-bar" id="bar1"></div>
          <div class="s-bar" id="bar2"></div>
          <div class="s-bar" id="bar3"></div>
        </div>
        <span class="strength-label" id="strength-text"></span>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">Xác nhận mật khẩu</label>
      <div class="input-wrap">
        <span class="input-icon material-symbols-outlined">lock_reset</span>
        <input id="confirm-password" type="password" placeholder="Nhập lại mật khẩu"/>
        <button class="btn-toggle-pass" type="button" onclick="togglePass('confirm-password', this)">
          <span class="material-symbols-outlined">visibility</span>
        </button>
      </div>
    </div>

    <button class="btn-primary" id="btn-step2" onclick="handleStep2()">
      Cập nhật mật khẩu
      <span class="material-symbols-outlined">check_circle</span>
    </button>

    <button class="btn-ghost" onclick="goStep(1)">
      <span class="material-symbols-outlined">arrow_back</span>
      Quay lại
    </button>
  </div>

</div>

<script>
const API = 'http://180.93.37.143:8080';
let savedEmail = '';

function goStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');

  const dot1 = document.getElementById('dot1');
  const dot2 = document.getElementById('dot2');
  const line1 = document.getElementById('line1');

  if (n === 1) {
    dot1.className = 'step-dot active';
    dot2.className = 'step-dot';
    line1.className = 'step-line';
  } else {
    dot1.className = 'step-dot done';
    dot2.className = 'step-dot active';
    line1.className = 'step-line done';
  }
}

async function handleStep1() {
  const email = document.getElementById('email').value.trim();
  const btn = document.getElementById('btn-step1');
  const emailInput = document.getElementById('email');

  if (!email) { showErr('err1', 'Vui lòng nhập email!'); emailInput.classList.add('input-error'); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showErr('err1', 'Email không đúng định dạng!'); emailInput.classList.add('input-error'); return; }

  emailInput.classList.remove('input-error');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span> Đang kiểm tra email...';

  try {
    const res = await fetch(`${API}/api/auth/forgot-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const json = await res.json();

    if (json.success) {
      savedEmail = email;
      document.getElementById('step2-desc').textContent = `Tạo mật khẩu mới cho tài khoản: ${email}`;
      btn.style.background = 'linear-gradient(135deg, #15803d, #22c55e)';
      btn.innerHTML = '✅ Email hợp lệ!';
      setTimeout(() => {
        goStep(2);
        btn.disabled = false;
        btn.style.background = '';
        btn.innerHTML = 'Xác nhận email <span class="material-symbols-outlined">arrow_forward</span>';
      }, 900);
    } else {
      // Email không tồn tại trong hệ thống
      showErr('err1', json.message || 'Email này chưa được đăng ký trong hệ thống!');
      emailInput.classList.add('input-error');
      btn.disabled = false;
      btn.innerHTML = 'Xác nhận email <span class="material-symbols-outlined">arrow_forward</span>';
    }
  } catch (e) {
    showErr('err1', 'Không kết nối được server! Vui lòng thử lại.');
    btn.disabled = false;
    btn.innerHTML = 'Xác nhận email <span class="material-symbols-outlined">arrow_forward</span>';
  }
}

async function handleStep2() {
  const newPass = document.getElementById('new-password').value.trim();
  const confirmPass = document.getElementById('confirm-password').value.trim();
  const btn = document.getElementById('btn-step2');

  if (!newPass || newPass.length < 6) { showErr('err2', 'Mật khẩu phải có ít nhất 6 ký tự!'); return; }
  if (newPass !== confirmPass) { showErr('err2', 'Mật khẩu nhập lại không khớp!'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></span> Đang cập nhật...';

  try {
    const res = await fetch(`${API}/api/auth/reset-password`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: savedEmail, newPassword: newPass })
    });
    const json = await res.json();

    if (json.success) {
      const popup = document.getElementById('success-popup');
      popup.style.display = 'flex';
      let count = 3;
      const timer = setInterval(() => {
        count--;
        document.getElementById('countdown').textContent = count;
        if (count <= 0) { clearInterval(timer); window.location.href = 'login.html'; }
      }, 1000);
    } else {
      showErr('err2', json.message || 'Cập nhật thất bại, vui lòng thử lại!');
      btn.disabled = false;
      btn.innerHTML = 'Cập nhật mật khẩu <span class="material-symbols-outlined">check_circle</span>';
    }
  } catch (e) {
    showErr('err2', 'Không kết nối được server!');
    btn.disabled = false;
    btn.innerHTML = 'Cập nhật mật khẩu <span class="material-symbols-outlined">check_circle</span>';
  }
}

function togglePass(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('.material-symbols-outlined');
  if (input.type === 'password') { input.type = 'text'; icon.textContent = 'visibility_off'; }
  else { input.type = 'password'; icon.textContent = 'visibility'; }
}

function checkStrength() {
  const val = document.getElementById('new-password').value;
  const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')];
  const text = document.getElementById('strength-text');
  bars.forEach(b => b.style.background = 'var(--green-200)');
  if (!val) { text.textContent = ''; return; }
  if (val.length < 6) {
    bars[0].style.background = '#ef4444'; text.textContent = '🔴 Yếu'; text.style.color = '#ef4444';
  } else if (val.length < 10) {
    bars[0].style.background = '#f97316'; bars[1].style.background = '#f97316';
    text.textContent = '🟠 Trung bình'; text.style.color = '#f97316';
  } else {
    bars.forEach(b => b.style.background = '#16a34a');
    text.textContent = '🟢 Mạnh'; text.style.color = '#16a34a';
  }
}

function showErr(id, msg) {
  const el = document.getElementById(id);
  el.textContent = '❌ ' + msg;
  el.style.display = 'block';
}

// Clear errors on input
document.getElementById('email').addEventListener('input', () => {
  document.getElementById('err1').style.display = 'none';
  document.getElementById('email').classList.remove('input-error');
});
['new-password','confirm-password'].forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    document.getElementById('err2').style.display = 'none';
  });
});

// Enter keys
document.getElementById('email').addEventListener('keydown', e => { if (e.key === 'Enter') handleStep1(); });
document.getElementById('confirm-password').addEventListener('keydown', e => { if (e.key === 'Enter') handleStep2(); });
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
<script src="i18n.js"></script>
</body>
</html>
